server:
  port: ${APPLICATION_SERVICE_PORT:8083}

spring:
  application:
    name: application-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/application_db?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
